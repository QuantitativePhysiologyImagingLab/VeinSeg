[project]
name = "veinseg"
version = "1.0.0"
description = "Physics-informed cerebral vein segmentation from QSM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Yousif Al-Khoury" }
]
keywords = ["QSM", "vein segmentation", "MRI", "neuroimaging", "deep learning"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "torch>=2.1",
    "nnunetv2>=2.4",
    "nibabel",
    "numpy>=1.24",
    "scipy",
    "SimpleITK>=2.2.1",
    "huggingface_hub",
]

[project.scripts]
veinseg         = "veinseg.cli:main"
veinseg-install = "veinseg._checkpoint:install_main"

[build-system]
requires = ["setuptools>=67"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["veinseg*"]
